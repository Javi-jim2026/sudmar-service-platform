name: Deploy SUDMAR Service Platform to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-pages.yml"
      - "tests/**"
      - "package.json"
      - "supabase/migrations/**"
      - "docs/operational-redesign.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application code
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/repository.js
          node --check prototype/src/config.js
          node --check prototype/src/checklist.js
          python -m py_compile tools/import_workbook.py

      - name: Run core tests
        run: npm test

      - name: Validate activity flows in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
