name: Validate historic multiserial ticket
on:
  push:
    branches: ["fix/legacy-multiserial-2120-20261011"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/multi-equipment.js
          node --check prototype/src/repository.js
          node --check tests/ui.e2e.mjs
      - name: Core tests
        run: npm test
      - name: Browser end-to-end tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
