name: Validate Unsaved Editing Guards
on:
  push:
    branches: ["feature/unsaved-forms-guard-20261012"]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax verification
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/unsaved-guard.js
          node --check prototype/sw.js
          node --check tests/ui.e2e.mjs
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
