name: Validate ticket multi-choice filters
on:
  push:
    branches: ["feature/multi-ticket-filters-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/core.js
          node --check prototype/sw.js
          node --check tests/ui.e2e.mjs
      - name: Run unit tests
        run: npm test
      - name: Run browser tests against mocked data (never production)
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
