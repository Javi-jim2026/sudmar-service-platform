name: Validate serial recurrence staging
on:
  push:
    branches:
      - feature/persistent-serial-history-20261014
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/verify-serial-history.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/visibility.js
          node --check prototype/sw.js
      - name: Run automated unit tests
        run: npm test
      - name: Validate UI with simulated data
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
