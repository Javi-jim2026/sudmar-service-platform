name: Validate activity ticket display
on:
  push:
    branches: [feature/activity-parent-ticket-heading-20261014]
  pull_request:
    branches: [main]
    paths: [prototype/**, tests/**, .github/workflows/validate-activity-parent.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and unit tests
        run: |
          node --check prototype/src/app.js
          node --check tests/ui.e2e.mjs
          npm test
      - name: Test browser flow with mocked data
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
