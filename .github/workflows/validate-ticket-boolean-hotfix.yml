name: Validate ticket boolean hotfix
on:
  push:
    branches: ["fix/ticket-multi-boolean-20261011"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/repository.js
          node --check prototype/src/multi-equipment.js
          node --check prototype/sw.js
      - name: Core tests
        run: npm test
      - name: Playwright operational tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
