name: Validate Evidence Request Copy
on:
  push:
    branches: ["feature/evidence-request-copy-20261012"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/evidence-request.js
          node --check tests/ui.e2e.mjs
          node --check prototype/sw.js
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
