name: Verify multi-filter staging
on:
  push:
    branches:
      - feature/multiselect-ticket-filters-20261013-v2
    paths:
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/verify-multifilters.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check prototype/src/app.js
          node --check prototype/src/core.js
          node --check prototype/sw.js
      - name: Core regression tests
        run: npm test
      - name: UI tests against mocked services
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
