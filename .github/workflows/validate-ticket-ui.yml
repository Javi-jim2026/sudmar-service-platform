name: Validate ticket UI changes
on:
  pull_request:
    branches: [main]
    paths: ["prototype/**", "tests/**", "package.json", ".github/workflows/validate-ticket-ui.yml"]
  push:
    branches: ["feature/ticket-header-summary-20261014"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and unit tests
        run: |
          node --check prototype/src/app.js
          node --check prototype/sw.js
          node --check tests/ui.e2e.mjs
          npm test
      - name: UI regression tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui.e2e.mjs
          node tests/ticket-regressions.e2e.mjs
